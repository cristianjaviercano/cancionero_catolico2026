<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Filtro sutil de sombra ambiental litúrgica (sin contornos duros) -->
    <filter id="templarShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#a81111" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <!-- Gradiente profundo carmesí de la Cruz Pattée -->
    <radialGradient id="carminePatee" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="70%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </radialGradient>
  </defs>
  
  <!-- Disco de Alabastro / Sello Sagrado (Concepto 3) -->
  <circle cx="256" cy="256" r="248" fill="#f8f9fa" />
  <circle cx="256" cy="256" r="236" fill="#f4f5f4" />
  
  <!-- Cruz Pattée Heráldica -->
  <path d="M 172,76 L 340,76 C 278,188 324,234 436,172 L 436,340 C 324,278 278,324 340,436 L 172,436 C 234,324 188,278 76,340 L 76,172 C 188,234 234,188 172,76 Z" fill="url(#carminePatee)" filter="url(#templarShadow)" />
</svg>